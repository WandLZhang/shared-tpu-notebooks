# Zero to JupyterHub for a university LLM course.
#
# Read the profile list first. It contains the reason for the design.
#
# GKE gives one pod per TPU node and that pod owns every chip on the node. A v5e chip
# cannot be shared. A TPU-backed notebook therefore holds a $1.35/hr chip for as long as
# the browser tab is open, whether the student is running code or reading the
# assignment. For 300 students that is $405/hr, and most of them are typing.
#
# So students get a CPU notebook, and TPU work leaves the notebook as a queued Job
# (see notebooks/submit_tpu.py). The chip is held for the seconds the job runs.
#
# The pinned TPU notebook still exists, because interactive TPU debugging is a real
# need. It is restricted to staff. That restriction is the cost control.
#
# Pattern credit: ai-on-gke/quick-start-guides jupyter/profiles.md documents
# extra_resource_limits + node_selector for TPU profiles. Its template hardcodes
# ct4p-hightpu-4t / tpu-v4-podslice / 2x2x1 -- v4, which is us-central2-only and not
# reachable from an ordinary project. The labels below are the v5e equivalent.

hub:
  config:
    Authenticator:
      # Local part of the Google identity IAP forwards, i.e. everything before the @.
      admin_users:
        - instructor
      # IAP decides who gets in. Anyone reaching the hub has already been checked by
      # Google against roles/iap.httpsResourceAccessor, so a second allowlist here would
      # only reject people IAP just admitted. Without this, JupyterHub authenticates the
      # user and then refuses them, which reads as a broken login rather than a policy.
      #
      # Restrict membership on the IAP binding, not here. For a course that means a
      # group: gcloud projects add-iam-policy-binding PROJECT \
      #   --member=group:students@your-university.edu \
      #   --role=roles/iap.httpsResourceAccessor
      allow_all: true
  # Trust the identity IAP already verified, instead of asking the user again.
  #
  # IAP authenticates at the load balancer and forwards the result as a header:
  #
  #   X-Goog-Authenticated-User-Email: accounts.google.com:someone@example.com
  #
  # The header is only trustworthy because traffic cannot reach the pods except through
  # the GFE. That is enforced by the firewall, which allows 130.211.0.0/22 and
  # 35.191.0.0/16 and nothing else. Expose this Service any other way and the header
  # becomes forgeable, so do not pair this authenticator with a plain LoadBalancer.
  #
  # For production, verify the signed JWT in X-Goog-IAP-JWT-Assertion rather than
  # trusting the email header. The header is sufficient here because the only path in
  # is the IAP-protected one.
  extraConfig:
    iap-auth: |
      import base64
      import json
      import time
      from jupyterhub.auth import Authenticator
      from jupyterhub.handlers.login import LoginHandler
      from jupyterhub.utils import url_path_join
      from tornado import web

      IAP_JWT_HEADER = "X-Goog-IAP-JWT-Assertion"
      IAP_EMAIL_HEADER = "X-Goog-Authenticated-User-Email"

      def decode_iap_jwt_claims(jwt_str: str) -> dict:
          """Decode and validate claims from the IAP signed JWT."""
          parts = jwt_str.strip().split(".")
          if len(parts) != 3:
              raise ValueError("Malformed IAP JWT assertion token")
          
          payload_b64 = parts[1]
          payload_b64 += "=" * ((4 - len(payload_b64) % 4) % 4)
          payload_json = base64.urlsafe_b64decode(payload_b64.encode("utf-8")).decode("utf-8")
          claims = json.loads(payload_json)

          if claims.get("iss") != "https://cloud.google.com/iap":
              raise ValueError(f"Invalid IAP JWT issuer: {claims.get('iss')}")

          now = time.time()
          if "exp" in claims and claims["exp"] < (now - 30):
              raise ValueError("IAP JWT assertion has expired")

          if "email" not in claims:
              raise ValueError("IAP JWT assertion missing verified email claim")

          return claims

      class IAPLoginHandler(LoginHandler):
          async def get(self):
              jwt_assertion = self.request.headers.get(IAP_JWT_HEADER, "")
              email = ""

              if jwt_assertion:
                  try:
                      claims = decode_iap_jwt_claims(jwt_assertion)
                      email = claims["email"].strip().lower()
                  except Exception as e:
                      self.log.warning(f"IAP JWT validation failed: {e}")
                      raise web.HTTPError(
                          401,
                          f"Invalid IAP JWT assertion: {e}",
                      )
              else:
                  # Fallback to email header if JWT assertion header is not passed
                  raw_email = self.request.headers.get(IAP_EMAIL_HEADER, "")
                  if not raw_email:
                      raise web.HTTPError(
                          401,
                          "No IAP authentication headers. You reached the hub without going through IAP.",
                      )
                  email = raw_email.split(":", 1)[-1].strip().lower()

              # Keep the local part so pod names stay readable. Safe while every user
              # comes from one domain; add the domain back if that stops being true.
              username = email.split("@")[0]
              user = await self.auth_to_user({"name": username})
              self.set_login_cookie(user)
              self.redirect(url_path_join(self.hub.server.base_url, "spawn"))

      class IAPAuthenticator(Authenticator):
          # No login form. The user already signed in at the load balancer.
          auto_login = True

          def get_handlers(self, app):
              return [(r"/login", IAPLoginHandler)]

          async def authenticate(self, handler, data=None):
              return None

      c.JupyterHub.authenticator_class = IAPAuthenticator
  # Autopilot rejects privileged pods and enforces Pod Security Standards. Give the
  # hub an explicit non-root context rather than letting the chart's default get
  # rewritten by the Autopilot mutating webhook.
  containerSecurityContext:
    runAsUser: 1000
    runAsGroup: 1000
    allowPrivilegeEscalation: false
  # Autopilot consolidates nodes freely, and it moved the hub and proxy twice during a
  # single afternoon of TPU node churn. Each move killed the port-forward. A PDB does not
  # make eviction impossible on a single replica, but it stops routine consolidation.
  pdb:
    enabled: true
    minAvailable: 1
  extraPodSpec:
    priorityClassName: jupyterhub-core

proxy:
  service:
    # ClusterIP, not LoadBalancer. An L4 LB can never get an address in this org, so it
    # retried and failed on a loop. The Ingress in k8s/ingress-iap.yaml fronts this
    # Service instead, and GKE builds NEGs pointing straight at the pods.
    type: ClusterIP
    annotations:
      cloud.google.com/neg: '{"ingress": true}'
      cloud.google.com/backend-config: '{"default": "hub-iap"}'
  chp:
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
    pdb:
      enabled: true
      minAvailable: 1
    extraPodSpec:
      priorityClassName: jupyterhub-core

# Both of these are off for Autopilot.
#   userScheduler packs users onto the fewest nodes so the rest can scale down. On
#   Autopilot the platform already owns node packing, and the chart's scheduler needs
#   RBAC that Autopilot restricts.
#   prePuller pre-pulls the singleuser image onto every node with a DaemonSet. On
#   Autopilot that means holding nodes up purely to cache an image, which is the
#   opposite of scale-to-zero.
scheduling:
  userScheduler:
    enabled: false
  podPriority:
    enabled: false
  userPlaceholder:
    enabled: false

prePuller:
  hook:
    enabled: false
  continuous:
    enabled: false

cull:
  enabled: true
  # A student who closes the laptop should not hold a pod all night. One hour idle,
  # checked every five minutes. maxAge 12h catches the tab left open over a weekend.
  timeout: 3600
  every: 300
  maxAge: 28800

singleuser:
  # z2jh ships a `block-cloud-metadata` initContainer that runs privileged with
  # NET_ADMIN and installs an iptables rule against 169.254.169.254. Autopilot rejects
  # it outright:
  #
  #   denied by autogke-disallow-privilege: container block-cloud-metadata is privileged
  #   denied by autogke-default-linux-capabilities: capability 'NET_ADMIN' not allowed
  #
  # The spawn fails with a 400 from the GKE Warden webhook and the pod never appears,
  # so this is the first thing that breaks z2jh on Autopilot.
  #
  # Turning it off is the DOCUMENTED answer here, not a workaround. z2jh blocks the
  # metadata endpoint two ways and only needs one. The second way is the singleuser
  # NetworkPolicy, which already denies 169.254.169.254, and the z2jh security guide
  # says to prefer that and set blockWithIptables to false whenever a NetworkPolicy
  # controller is present. GKE Dataplane V2 is Cilium, so one is present.
  #   https://z2jh.jupyter.org/en/stable/administrator/security.html
  #
  # Two conditions must hold before you copy this line elsewhere:
  #   1. A NetworkPolicy controller enforces policy. Without one the cluster silently
  #      ignores the rules and nothing blocks the metadata server at all.
  #   2. networkPolicy.enabled stays true and egressAllowRules.cloudMetadataServer
  #      stays false, below. Since chart 3.0.0 setting blockWithIptables AND
  #      cloudMetadataServer both true is rejected as ambiguous.
  #
  # This cluster also runs Workload Identity in GKE_METADATA mode, which puts the GKE
  # Metadata Server between the pod and the node service account. That is defence in
  # depth, not the reason this is safe.
  cloudMetadata:
    blockWithIptables: false

  # z2jh puts a NetworkPolicy on singleuser pods that denies egress to private IP
  # ranges. That is a good default and it breaks this design, because submit_tpu.py
  # talks to the Kubernetes API server to create its Job and the API server sits on a
  # private address. The symptom is a bare connect timeout to the API ClusterIP, with
  # nothing in the hub log, because the packet is dropped rather than refused.
  #
  # Open exactly the API server and nothing else. Do NOT reach for privateIPs: true --
  # that would let student code talk to every other pod and node in the cluster,
  # including other students' notebooks.
  #
  # Allow the API server's REAL ENDPOINT, not its ClusterIP. This is the part that
  # costs an hour if you get it wrong.
  #
  # GKE Dataplane V2 (Cilium) evaluates egress policy AFTER the Service DNAT. A rule
  # permitting the `kubernetes` ClusterIP 34.118.224.1 therefore never matches: by the
  # time policy runs, the destination has already been rewritten to the master's
  # private endpoint, which lands inside the 10.0.0.0/8 block that z2jh's catch-all
  # rule explicitly excepts. The packet is dropped and the client sees a bare connect
  # timeout to the ClusterIP, which points at the wrong address entirely.
  #
  # Get the endpoint, not the Service IP:
  #   kubectl get endpoints kubernetes -n default -o jsonpath='{.subsets[0].addresses[0].ip}'
  #
  # It is stable for the life of the cluster. 02_create_cluster.sh prints it, and
  # 03_deploy_hub.sh substitutes it, so this value is not hand-maintained.
  networkPolicy:
    enabled: true
    egressAllowRules:
      cloudMetadataServer: false
      privateIPs: false
    egress:
      - to:
          - ipBlock:
              cidr: __APISERVER_ENDPOINT__/32
        ports:
          - protocol: TCP
            port: 443

  storage:
    type: dynamic
    capacity: 10Gi
    dynamic:
      storageClass: standard-rwo
  # Service account the notebook uses to submit TPU Jobs. Bound by RBAC in
  # 03_deploy_hub.sh to create Jobs in its own namespace and nothing else.
  serviceAccountName: student
  # A notebook holds live state and a person is waiting on it. TPU jobs are fungible and
  # get student-tpu-job (100) instead, so chips yield and sessions do not. Before this,
  # everything sat at priority 0 and a running notebook was evicted mid-session during a
  # scale test. See k8s/priority-classes.yaml.
  extraPodConfig:
    priorityClassName: student-notebook
    # GKE Sandbox (gVisor) provides strong container isolation. Cloud TPU pods
    # cannot use gVisor, so this is disabled on the Pinned TPU profile.
    runtimeClassName: gvisor
  extraEnv:
    KUEUE_LOCAL_QUEUE: "tpu"
    # submit_tpu.py is mounted here rather than into /home/jovyan, because the home
    # directory is a PVC and a ConfigMap mount would fight it.
    PYTHONPATH: "/opt/course"
  # 03_deploy_hub.sh fills stringData from notebooks/submit_tpu.py with helm
  # --set-file, so the helper stays one real file instead of a copy pasted into YAML.
  extraFiles:
    submit_tpu.py:
      mountPath: /opt/course/submit_tpu.py
      stringData: "placeholder, replaced at deploy time"
    hw0_tpu_hello.ipynb:
      mountPath: /opt/course/hw0_tpu_hello.ipynb
      stringData: "placeholder, replaced at deploy time"
  # Two jobs at spawn.
  #
  # 1. Install the kubernetes client. The scipy-notebook image has none and
  #    submit_tpu.py needs one. Bake this into a course image for a real term.
  #
  # 2. Copy the assignment into the student's home directory. extraFiles mounts are
  #    read-only ConfigMap volumes, so the notebook cannot live in /home/jovyan
  #    directly -- the home directory is a PVC and the two would fight. Mount it under
  #    /opt/course and copy on first spawn instead.
  #
  #    `cp -n` matters: without it, every restart would overwrite the student's work
  #    with the blank assignment.
  lifecycleHooks:
    postStart:
      exec:
        command:
          - "sh"
          - "-c"
          - "cp -n /opt/course/hw0_tpu_hello.ipynb /home/jovyan/ 2>/dev/null || true"
  defaultUrl: "/lab"
  image:
    name: quay.io/jupyter/scipy-notebook
    tag: "2024-11-11"

  profileList:
    - display_name: "Course default — CPU notebook"
      description: >-
        2 vCPU, 8 GB. Where you write and debug. Run TPU work from here with
        submit_tpu.run(); the chip is attached only while your job runs.
      default: true
      # 2 vCPU, not 4. The heavy work happens on the chip, so a notebook that only edits
      # code and submits jobs does not need more. Three things improve at once: two
      # notebooks fit per node instead of one, the concurrent-notebook ceiling roughly
      # doubles on the same CPUS quota, and each node keeps enough slack that a new system
      # DaemonSet no longer has to evict a student to fit.
      kubespawner_override:
        cpu_limit: 2
        cpu_guarantee: 2
        mem_limit: 8G
        mem_guarantee: 8G
        # Spot VMs cut notebook cost by 60-91%. Student state lives on the PVC,
        # so a preemption is just a page reload — no work lost.
        node_selector:
          cloud.google.com/gke-spot: "true"

    - display_name: "Large CPU notebook"
      description: >-
        8 vCPU, 32 GB, for dataset preprocessing and tokenizer training. Still no
        accelerator — TPU work goes through the queue.
      kubespawner_override:
        cpu_limit: 8
        cpu_guarantee: 8
        mem_limit: 32G
        mem_guarantee: 32G
        node_selector:
          cloud.google.com/gke-spot: "true"

    - display_name: "Pinned TPU v5e notebook (staff only)"
      description: >-
        One v5e chip attached to the notebook for as long as it runs, for interactive
        debugging. Bills the whole ct5lp-hightpu-1t node at about $1.35/hr. Staff only,
        because a class of 300 doing this is $360/hr.
      allowed_groups:
        - staff
      kubespawner_override:
        image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
        extra_resource_limits:
          google.com/tpu: "1"
        extra_pod_config:
          # Cloud TPUs require direct hardware driver access, which is incompatible
          # with gVisor. Disable the hub-wide gVisor default for this profile.
          runtimeClassName: ""
        node_selector:
          cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
          cloud.google.com/gke-tpu-topology: 1x1
        tolerations:
          - key: google.com/tpu
            operator: Exists
            effect: NoSchedule
        # Shorter leash than the CPU profiles. An idle pinned chip is the single most
        # expensive thing a person can leave running in this cluster.
        cull_timeout: 1800
