# One student's TPU homework run. This is the unit the whole classroom is built from.
#
# Shape notes, all of which are forced by GKE and not by preference:
#
#   * One pod per TPU node, and the pod takes every chip on that node. A v5e chip
#     cannot be split between two students. ct5lp-hightpu-1t has exactly one chip,
#     so google.com/tpu: 1 consumes the node.
#   * On Autopilot you do not name the machine type. The two nodeSelector labels
#     below are what make GKE pick ct5lp-hightpu-1t, and Autopilot then bills the
#     whole node (24 vCPU, 48 GiB) for as long as the pod runs. Short jobs are the
#     point.
#   * The google.com/tpu toleration is required. TPU nodes carry a NoSchedule taint.
#
# The kueue.x-k8s.io/queue-name label is what holds this job in a queue instead of
# letting 300 of them stampede the chip pool at once. Drop the label and the job
# schedules immediately -- which is the failure mode, not a shortcut.
#
# Placeholders substituted by scripts/04_scale_test.sh:
#   __STUDENT__   student id, e.g. student-000
#   __NAMESPACE__ that student's namespace
#   __QUEUE__     LocalQueue name in that namespace
apiVersion: batch/v1
kind: Job
metadata:
  name: __STUDENT__
  namespace: __NAMESPACE__
  labels:
    kueue.x-k8s.io/queue-name: __QUEUE__
    tpu-class/student: __STUDENT__
spec:
  # Kueue suspends the job on admission control, so let it own the lifecycle.
  suspend: true
  # backoffLimit 0 deletes the pod the moment it fails and takes the logs with it.
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        tpu-class/student: __STUDENT__
    spec:
      restartPolicy: Never
      # Fungible on purpose. This yields to a student notebook, which holds live state,
      # and Kueue simply re-queues it. 100 stays above GKE's -10 expendable cutoff so the
      # autoscaler still builds nodes for it. See k8s/priority-classes.yaml.
      priorityClassName: student-tpu-job
      nodeSelector:
        cloud.google.com/gke-tpu-accelerator: tpu-v5-lite-podslice
        cloud.google.com/gke-tpu-topology: 1x1
      tolerations:
        - key: google.com/tpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: hw
          image: us-docker.pkg.dev/cloud-tpu-images/jax-ai-image/tpu:latest
          env:
            - name: STUDENT
              value: __STUDENT__
            # Fail loudly on a CPU fallback. Without this a broken TPU binding
            # silently runs the assignment on CPU and every number is wrong.
            - name: JAX_PLATFORMS
              value: "tpu"
          command: ["python3", "-c"]
          args:
            - |
              import os, time, json, socket
              import jax, jax.numpy as jnp

              student = os.environ["STUDENT"]
              devs = jax.devices()
              assert devs[0].platform == "tpu", f"not on TPU: {devs}"

              # HW0: multi-head attention forward pass, the shape an LLM course cares
              # about. B=8 heads=12 seq=1024 dh=64 -> a real v5e workload, not a toy.
              B, H, S, D = 8, 12, 1024, 64
              key = jax.random.PRNGKey(abs(hash(student)) % (2**31))
              q, k, v = jax.random.normal(key, (3, B, H, S, D), dtype=jnp.bfloat16)

              @jax.jit
              def attn(q, k, v):
                  logits = jnp.einsum("bhqd,bhkd->bhqk", q, k) / jnp.sqrt(D).astype(q.dtype)
                  return jnp.einsum("bhqk,bhkd->bhqd", jax.nn.softmax(logits, axis=-1), v)

              out = attn(q, k, v).block_until_ready()          # compile
              t0 = time.perf_counter()
              for _ in range(50):
                  out = attn(q, k, v)
              out.block_until_ready()
              dt = (time.perf_counter() - t0) / 50

              # 2 einsums, each 2*B*H*S*S*D flops
              tflops = (4 * B * H * S * S * D) / dt / 1e12

              print(json.dumps({
                  "student":  student,
                  "host":     socket.gethostname(),
                  "node":     os.environ.get("NODE_NAME", "?"),
                  "chips":    len(devs),
                  "device":   str(devs[0]),
                  "ms":       round(dt * 1e3, 3),
                  "tflops":   round(tflops, 2),
                  "checksum": float(jnp.sum(out.astype(jnp.float32))),
              }), flush=True)
              print(f"TPU chips: {len(devs)} :: {devs}", flush=True)
          resources:
            limits:
              google.com/tpu: "1"
            requests:
              google.com/tpu: "1"
